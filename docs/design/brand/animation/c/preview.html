<style>

</style></head><body><main><h1>C: Happy wiggle</h1><p class="sub">Cut from the approved hero art and animated in code. Breathing, a blink, the signature gesture, and tap to laugh. Freeze a frame with ?t=seconds (and &amp;tap=seconds since a tap).</p>
<style>

.cast-card .st{background:var(--stage,linear-gradient(165deg,#f4f0ff,#e9e2fb));border-radius:14px}
.cast-card canvas{display:block;width:100%;aspect-ratio:1300/1160;cursor:pointer;touch-action:manipulation;border-radius:14px}
.cast-card canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cast-card h3{margin:10px 2px 2px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cast-card h3 small{font-weight:600;font-size:11px;color:var(--muted);background:var(--chip,rgba(124,58,237,.1));border-radius:999px;padding:2px 8px;white-space:nowrap}
.cast-card p{margin:4px 2px 0;font-size:13px;line-height:1.4;color:var(--muted)}
.cast-card p b{color:var(--fg);font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 22px}
.cmp figure{margin:0;background:var(--card);border-radius:18px;padding:10px}
.cmp .st{background:var(--stage,linear-gradient(165deg,#f4f0ff,#e9e2fb));border-radius:14px;display:flex;justify-content:center}
.cmp canvas{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.cmp figcaption{font-size:13px;color:var(--muted);margin:8px 2px 0}.cmp figcaption b{color:var(--fg)}
@media (max-width:520px){.cmp{grid-template-columns:1fr 1fr;gap:8px}.cast-grid{grid-template-columns:1fr 1fr;gap:8px}.cast-card p{font-size:12px}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dk{--card:#1c1630;--stage:linear-gradient(165deg,#221a3b,#130f22);--muted:#a597c4;--fg:#efe9fb;--chip:#2a2145}.lt{--card:#fff;--stage:linear-gradient(165deg,#f4f0ff,#e9e2fb);--muted:#6c5f89;--fg:#21183a;--chip:#efe8fd}.pair .cast-card{color:var(--fg)}@media (max-width:520px){.pair{grid-template-columns:1fr}}</style><div class="pair"><div class="lt"><figure class="cast-card"><div class="st"><canvas data-rig="c" tabindex="0" role="button" aria-label="C: Happy wiggle. Tap to make them laugh."></canvas></div><h3>C<small>rest diff 0.000/255</small></h3><p><b>Happy wiggle</b></p><p>Rocks side to side on his feet with a little squash, then settles. Tap: ^ ^ eyes and his C mouth stretches open so the teeth part.</p></figure></div><div class="dk"><figure class="cast-card"><div class="st"><canvas data-rig="c" tabindex="0" role="button" aria-label="C: Happy wiggle. Tap to make them laugh."></canvas></div><h3>C<small>rest diff 0.000/255</small></h3><p><b>Happy wiggle</b></p><p>Rocks side to side on his feet with a little squash, then settles. Tap: ^ ^ eyes and his C mouth stretches open so the teeth part.</p></figure></div></div><script>// Wordocious puppet player: draws a cast rig (layers cut from the approved hero art) on a <canvas>.

    linear: x => x, in: x => x * x, out: x => 1 - (1 - x) * (1 - x),
    inOut: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
    sine: x => .5 - .5 * Math.cos(Math.PI * x),
    inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
    outBack: x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },

  function val(R, spec, t, still, dflt) {

    if (typeof spec === 'number') return spec;
    if (typeof spec === 'string') return still ? restVal(R, spec) : trackVal(R, spec, t);
    let s = 0; for (const x of spec) s += val(R, x, t, still, 0); return s;
  }
  function restVal(R, name) { const tr = R.tracks[name]; return tr && tr.kf ? tr.kf[0][1] : 0; }
  // deterministic blink schedule, every 3 to 5 s
  function blinkTimes(seed, start) { const out = []; let t = start, s = seed; while (t < 900) { out.push(t); s = (s * 9301 + 49297) % 233280; t += 3 + 2 * (s / 233280); } return out; }
  function blinkState(R, t) {
    for (const b of R._blinks) { if (b > t) break; const d = t - b; if (d < 0.16) return d < 0.04 || d > 0.12 ? 'half' : 'closed'; }
    return null;
  }
  function add(rig, lay) {
    const R = Object.assign({ tracks: {}, hop: 70, cycle: 6 }, rig); R.lay = lay; R.imgs = {}; R.ready = false;
    R._blinks = blinkTimes(rig.blinkSeed || 7, rig.blinkStart || 1.3);
    let n = 0; const names = Object.keys(lay);
    R.whenReady = new Promise(res => names.forEach(k => {
      const im = new Image(); im.onload = () => { if (++n === names.length) { R.ready = true; res(); } }; im.src = lay[k].src; R.imgs[k] = im;
    }));
    RIGS[rig.id] = R; return R;
  }
  function placeLayer(ctx, R, L, t, still) {
    const l = R.lay[L.img];
    const piv = L.pivot || [l.x, l.y];
    const at = L.at || piv;
    const pin = L.pivotInImg || [piv[0] - l.x, piv[1] - l.y];
    const rot = val(R, L.rot, t, still, 0), dx = val(R, L.dx, t, still, 0), dy = val(R, L.dy, t, still, 0);
    const s = val(R, L.s, t, still, 1), sx = val(R, L.sx, t, still, 1) * s, sy = val(R, L.sy, t, still, 1) * s;
    const alpha = L.alpha === undefined ? 1 : clamp(val(R, L.alpha, t, still, 1), 0, 1);
    return { l, at, pin, rot, dx, dy, sx, sy, alpha };
  }
  function drawLayer(ctx, R, L, t, still, buf) {
    const P = placeLayer(ctx, R, L, t, still), l = P.l;
    if (P.alpha <= 0.002) return;
    const rest = Math.abs(P.rot) < 0.01 && Math.abs(P.dx) < 0.05 && Math.abs(P.dy) < 0.05 && Math.abs(P.sx - 1) < 1e-3 && Math.abs(P.sy - 1) < 1e-3;

    const im = R.imgs[L.img];

      const C = L.ripple, pad = Math.ceil(C.amp) + 2;

      const ox = oc.getContext('2d'); ox.clearRect(0, 0, oc.width, oc.height);
      for (let y = 0; y < l.h; y++) {

    ctx.setTransform(k, 0, 0, k, 0, 0); ctx.clearRect(0, 0, S.w, S.h);

      if (!still) {
        if (tap < 0.08) sq = -0.05 * Math.sin(tap / 0.08 * Math.PI / 2);                                  // crouch
        else if (tap < 0.48) { const p = (tap - 0.08) / 0.4; hop = -R.hop * Math.sin(p * Math.PI); sq = 0.03 * Math.sin(p * Math.PI); }

      ctx.save(); ctx.globalAlpha = 1 - 0.45 * f; ctx.translate(cx, cy); ctx.scale(g, g); ctx.translate(-cx, -cy);

      if (L.when === 'laugh' && !laugh) continue;
