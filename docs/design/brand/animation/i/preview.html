</style></head><body><main><h1>I: Sprout sway + shy sway</h1><p class="sub">Cut from the approved hero art and animated in code. Breathing, a blink, the signature gesture, and tap to laugh. Freeze a frame with ?t=seconds (and &amp;tap=seconds since a tap).</p>

    inOut: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
    sine: x => .5 - .5 * Math.cos(Math.PI * x),
    inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),

    return null;
  }
  function add(rig, lay) {

    R._blinks = blinkTimes(rig.blinkSeed || 7, rig.blinkStart || 1.3);

      for (let y = 0; y < l.h; y++) {
