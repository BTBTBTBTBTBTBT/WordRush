</style></head><body><main><h1>O (orange): Big blink + tongue wiggle</h1><p class="sub">Cut from the approved hero art and animated in code. Breathing, a blink, the signature gesture, and tap to laugh. Freeze a frame with ?t=seconds (and &amp;tap=seconds since a tap).</p>

    inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),

    return null;
  }
  function add(rig, lay) {

    R._blinks = blinkTimes(rig.blinkSeed || 7, rig.blinkStart || 1.3);

    const piv = L.pivot || [l.x, l.y];

    const pin = L.pivotInImg || [piv[0] - l.x, piv[1] - l.y];

    if (P.alpha <= 0.002) return;

      for (let y = 0; y < l.h; y++) {
