</style></head><body><main><h1>R: Slow yawn</h1><p class="sub">Cut from the approved hero art and animated in code. Breathing, a blink, the signature gesture, and tap to laugh. Freeze a frame with ?t=seconds (and &amp;tap=seconds since a tap).</p>
