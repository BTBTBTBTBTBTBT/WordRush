org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# Android (only consumed by the :app module; :core is pure JVM and ignores these)
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 36 is newer than AGP 8.6.1 formally knows about, so it warns on
# every build. It compiles and bundles correctly; this is Google's documented
# acknowledgement flag. Drop this line when AGP is upgraded past 8.9.
android.suppressUnsupportedCompileSdk=36
