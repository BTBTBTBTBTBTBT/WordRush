<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Push art (lib/push/art-inline.ts): Vercel's functions have no system fonts, so the mascot's letter rendered as a
     missing-glyph box. FONTCONFIG_PATH points here; the only font is the app's own Nunito. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Nunito</family></prefer></alias>
</fontconfig>
