<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordocious - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 2.8 look: the page wall, the WORDOCIOUS cast banner, one soft card, the purple family button.
       Everything here is precached by sw.js (OFFLINE_ASSETS) so it draws with no connection. */
    body {
      font-family: 'Nunito', ui-rounded, system-ui, -apple-system, sans-serif;
      background: #efe6ff url(/art/art-wall-home.webp) center / cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px 32px;
    }
    @media (min-aspect-ratio: 1/1), (min-width: 1024px) {
      body { background-image: url(/art/art-wall-home-wide.webp); }
    }
    .col { width: 100%; max-width: 384px; flex: 1; display: flex; flex-direction: column; }
    .cast { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 8px 22px rgba(124, 58, 237, 0.16); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 14px; }
    .card {
      width: 100%;
      text-align: center;
      border-radius: 24px;
      padding: 20px 24px 22px;
      background: linear-gradient(#7c3aed20, #7c3aed20), #ffffff;
      border: 1.5px solid #7c3aed45;
      box-shadow: inset 0 10px 0 #7c3aed, 0 14px 36px #7c3aed2e;
      color: #3b1a78;
    }
    .scene { display: block; margin: 8px auto 8px; width: 169px; max-width: 60%; height: auto; }
    h1 { font-size: 28px; font-weight: 900; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; margin: 4px 0 8px; color: #6d28d9; }
    p { font-size: 14px; font-weight: 700; color: #5b4a7d; margin-bottom: 20px; line-height: 1.45; }
    button {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      background: linear-gradient(#a66bff, #6d28d9);
      box-shadow: inset 0 0 0 2px #f5c542, 0 4px 0 #471a8d, 0 9px 14px rgba(59, 26, 120, 0.28);
      text-shadow: 1.5px 0 0 #3b1a78, -1.5px 0 0 #3b1a78, 0 1.5px 0 #3b1a78, 0 -1.5px 0 #3b1a78, 0 3px 4px rgba(40, 10, 80, 0.35);
      transition: transform 0.1s;
    }
    button:active { transform: translateY(2px) scale(0.98); box-shadow: inset 0 0 0 2px #f5c542, 0 2px 0 #471a8d, 0 5px 8px rgba(59, 26, 120, 0.28); }
    @media (prefers-color-scheme: dark) {
      body { background-color: #120d1f; }
      .card { background: linear-gradient(#7c3aed20, #7c3aed20), #261d3f; color: #f1e9ff; }
      h1 { color: #c4b5fd; }
      p { color: #cdbfe8; }
    }
  </style>
</head>
<body>
  <div class="col">
    <img class="cast" src="/email/email-header.png" width="1120" height="260" alt="Wordocious" draggable="false">
    <div class="main">
      <div class="card" role="status">
        <img class="scene" src="/art/art-scene-r-unplugged.webp" width="169" height="140" alt="" aria-hidden="true" draggable="false">
        <h1>No connection</h1>
        <p>Wordocious needs an internet connection to load puzzles and sync your progress. Check your connection and try again.</p>
        <button onclick="window.location.reload()">Try Again</button>
      </div>
    </div>
  </div>
</body>
</html>
