name: Wordocious
options:
  bundleIdPrefix: com.wordocious
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WordociousCore:
    path: .
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  # Ads: Unity LevelPlay (ironSource mediation) — see docs/LEVELPLAY_SETUP.md.
  # AdMob died with the publisher entity (Google ban, 2026-09-01); AppLovin MAX
  # was the §252 replacement but its account never activated (AppLovin stopped
  # taking signups, 2026-09-23). The AdMob/Google adapter must NEVER be added
  # here. Official SPM package (docs.unity.com → LevelPlay → iOS → SDK
  # integration): product `UnityMediationSDK`, exact-version pinned; SPM needs
  # SDK ≥ 9.3.0. Mediation adapters come as separate packages named
  # LevelPlay-<Network>-Adapter-Swift-Package, added when the account exists.
  # The manifest cannot carry `-ObjC` itself (SPM forbids unsafeFlags in
  # versioned deps), so OTHER_LDFLAGS below adds it as the docs require.
  LevelPlaySDK:
    url: https://github.com/ironsource-mobile/LevelPlay-Swift-Package
    exactVersion: 9.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.0.0

targets:
  Wordocious:
    type: application
    platform: iOS
    sources:
      - path: Wordocious/Sources
      - path: Wordocious/Resources
    dependencies:
      - target: WordociousWidget
        embed: true
      - package: WordociousCore
        product: WordociousCore
      - package: Supabase
        product: Supabase
      - package: SocketIO
        product: SocketIO
      - package: LevelPlaySDK
        product: UnityMediationSDK
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sentry
        product: Sentry
    info:
      path: Wordocious/Info.plist
      properties:
        CFBundleDisplayName: Wordocious
        # Exempt encryption only (HTTPS/TLS via the OS + CryptoKit) — declare it
        # so App Store Connect stops prompting the export-compliance dialog on
        # every upload. Matches the "None of the algorithms above" answer.
        ITSAppUsesNonExemptEncryption: false
        # Pull the bundle version/short-version from the build settings
        # (CURRENT_PROJECT_VERSION / MARKETING_VERSION) so a bumped build number
        # actually reaches the binary — xcodegen otherwise hardcodes "1".
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Nunito.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.wordocious.app.auth
            CFBundleURLSchemes:
              - com.wordocious.app
          # Widget deep links (wordocious://daily/<MODE>) — widget-only scheme.
          - CFBundleURLName: com.wordocious.app.widget
            CFBundleURLSchemes:
              - wordocious
          # Google Sign-In callback — the reversed iOS OAuth client ID.
          - CFBundleURLName: com.wordocious.app.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.193086095286-4ftdf92g8cnsur8kd7odqq0jueqq5oog
        # (GADApplicationIdentifier left with AdMob. The LevelPlay app key is
        # NOT a plist key — it is passed to LPMInitRequestBuilder in
        # AdsManager.swift.)
        # App Tracking Transparency prompt copy. AdsManager requests ATT itself,
        # once, before the LevelPlay SDK initializes (LevelPlay has no CMP).
        NSUserTrackingUsageDescription: Allow tracking to show you more relevant ads. Wordocious never sells your data.
        # Camera permission — used only when taking a new profile photo.
        NSCameraUsageDescription: Take a photo for your Wordocious profile picture.
        # SKAdNetwork attribution. su67r6k2v3 is ironSource's own id (LevelPlay
        # iOS SDK-integration docs). Every mediated network needs its own entry
        # or its installs go unattributed — paste the FULL current list from the
        # LevelPlay docs (Integration → iOS → SKAdNetwork) once the account
        # exists and the network stack is chosen. Never add Google's.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
        # Universal SKAN reporting: copies of winning install postbacks go to
        # ironSource, per the same docs page.
        NSAdvertisingAttributionReportEndpoint: https://postbacks-is.com/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordocious.app
        PRODUCT_NAME: Wordocious
        DEVELOPMENT_TEAM: Q32F6GRDYG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Wordocious/Wordocious.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.30"
        CURRENT_PROJECT_VERSION: "187"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required by the LevelPlay SDK (Objective-C categories inside the
        # xcframework); its Package.swift documents that SPM cannot set it.
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        # §256: Release is MANUAL-signed to a named App Store profile. Apple's
        # Individual→Organization conversion kept team Q32F6GRDYG but never
        # rewrites existing profiles — TeamName is frozen at generation — so a
        # profile picked by automatic signing can still read the individual
        # name. These were created via POST /v1/profiles (2026-09-08/09) and
        # decode to "Showloud, LLC". ship.sh installs them by name every run
        # and refuses to upload an IPA whose embedded TeamName differs.
        # Debug stays Automatic (simulator / device runs are unaffected).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wordocious AppStore w/ groups"

  WordociousWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WordociousWidget/Sources
      # The app's asset catalog, so mode chips draw the SAME icons as the
      # home menu (skull, shield, hands…). 652K total — cheap to duplicate,
      # and it keeps the icons single-sourced instead of a copied catalog.
      - path: Wordocious/Resources/Assets.xcassets
    info:
      path: WordociousWidget/Info.plist
      properties:
        CFBundleDisplayName: Wordocious
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordocious.app.widgets
        PRODUCT_NAME: WordociousWidget
        DEVELOPMENT_TEAM: Q32F6GRDYG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WordociousWidget/WordociousWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.30"
        CURRENT_PROJECT_VERSION: "187"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Release:  # §256 — see the app target's note
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Wordocious Widgets App Store LLC"

schemes:
  Wordocious:
    build:
      targets:
        Wordocious: all
    run:
      # Local StoreKit testing — lets purchases run in the simulator without
      # App Store Connect. Remove/ignore for App Store builds (real products).
      storeKitConfiguration: Wordocious.storekit

fileGroups:
  - Wordocious.storekit
