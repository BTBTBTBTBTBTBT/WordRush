name: Wordocious
options:
  bundleIdPrefix: com.wordocious
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WordociousCore:
    path: .
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  # §252: AdMob is gone for good — Google banned the publisher entity on
  # 2026-09-01. AppLovin MAX is the replacement (separate company, separate
  # policy). Its SPM package also links AppTrackingTransparency for us, since
  # AppLovin's CMP presents the ATT prompt as part of its consent flow.
  AppLovinSDK:
    url: https://github.com/AppLovin/AppLovin-MAX-Swift-Package
    from: 13.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.0.0

targets:
  Wordocious:
    type: application
    platform: iOS
    sources:
      - path: Wordocious/Sources
      - path: Wordocious/Resources
    dependencies:
      - target: WordociousWidget
        embed: true
      - package: WordociousCore
        product: WordociousCore
      - package: Supabase
        product: Supabase
      - package: SocketIO
        product: SocketIO
      - package: AppLovinSDK
        product: AppLovinSDK
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sentry
        product: Sentry
    info:
      path: Wordocious/Info.plist
      properties:
        CFBundleDisplayName: Wordocious
        # Exempt encryption only (HTTPS/TLS via the OS + CryptoKit) — declare it
        # so App Store Connect stops prompting the export-compliance dialog on
        # every upload. Matches the "None of the algorithms above" answer.
        ITSAppUsesNonExemptEncryption: false
        # Pull the bundle version/short-version from the build settings
        # (CURRENT_PROJECT_VERSION / MARKETING_VERSION) so a bumped build number
        # actually reaches the binary — xcodegen otherwise hardcodes "1".
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Nunito.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.wordocious.app.auth
            CFBundleURLSchemes:
              - com.wordocious.app
          # Widget deep links (wordocious://daily/<MODE>) — widget-only scheme.
          - CFBundleURLName: com.wordocious.app.widget
            CFBundleURLSchemes:
              - wordocious
          # Google Sign-In callback — the reversed iOS OAuth client ID.
          - CFBundleURLName: com.wordocious.app.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.193086095286-4ftdf92g8cnsur8kd7odqq0jueqq5oog
        # (§252: GADApplicationIdentifier removed with AdMob. The AppLovin SDK
        # key is NOT a plist key — it is passed to ALSdkInitializationConfiguration
        # in AdsManager.swift.)
        # App Tracking Transparency prompt copy. AppLovin's CMP presents this
        # prompt itself as the last step of its consent flow.
        NSUserTrackingUsageDescription: Allow tracking to show you more relevant ads. Wordocious never sells your data.
        # Camera permission — used only when taking a new profile photo.
        NSCameraUsageDescription: Take a photo for your Wordocious profile picture.
        # SKAdNetwork attribution. ludvb6z3bs is AppLovin's own; every mediated
        # network needs its own entry or its installs go unattributed. Paste the
        # full current list from AppLovin's dashboard once mediation is live —
        # MAX > Networks publishes a ready-made plist block.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordocious.app
        PRODUCT_NAME: Wordocious
        DEVELOPMENT_TEAM: Q32F6GRDYG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Wordocious/Wordocious.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.23"
        CURRENT_PROJECT_VERSION: "168"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WordociousWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WordociousWidget/Sources
      # The app's asset catalog, so mode chips draw the SAME icons as the
      # home menu (skull, shield, hands…). 652K total — cheap to duplicate,
      # and it keeps the icons single-sourced instead of a copied catalog.
      - path: Wordocious/Resources/Assets.xcassets
    info:
      path: WordociousWidget/Info.plist
      properties:
        CFBundleDisplayName: Wordocious
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordocious.app.widgets
        PRODUCT_NAME: WordociousWidget
        DEVELOPMENT_TEAM: Q32F6GRDYG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WordociousWidget/WordociousWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.23"
        CURRENT_PROJECT_VERSION: "168"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Wordocious:
    build:
      targets:
        Wordocious: all
    run:
      # Local StoreKit testing — lets purchases run in the simulator without
      # App Store Connect. Remove/ignore for App Store builds (real products).
      storeKitConfiguration: Wordocious.storekit

fileGroups:
  - Wordocious.storekit
